# Touch Grass Activity backend. Its OWN worker name, not collectclock-api or any other existing worker.
# Deployed 2026-11-12 to https://touch-grass-activity.j-chapman7.workers.dev (see ../README.md).

name = "touch-grass-activity"
account_id = "6604734f6224c90d45b3d817f9dfab23"
main = "src/index.ts"
compatibility_date = "2026-03-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "TouchGrassRoom"

# SQLite-backed Durable Objects (the class type available on the Workers Free plan per Cloudflare docs;
# confirm on your account before deploying).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TouchGrassRoom"]

# Live-tables registry: one singleton DO. New class, new tag; v1 above is untouched.
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveRegistry"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LiveRegistry"]

[vars]
DISCORD_CLIENT_ID = "1445916179163250860"
# DISCORD_CLIENT_SECRET is a secret: wrangler secret put DISCORD_CLIENT_SECRET --config worker/wrangler.toml
# ALLOW_GUEST must stay unset in production. For local dev put ALLOW_GUEST="true" in worker/.dev.vars.
