<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TiltCheck</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080a0e;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.09);
      --text: #f8fafc;
      --muted: #94a3b8;
      --teal: #17c3b2;
      --blurple: #5865F2;
      --font: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    html, body { width: 320px; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }
    body { padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 14px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: 0.04em; font-size: 15px; }
    .brand img { width: 22px; height: 22px; }
    .beta { font-size: 9px; font-weight: 800; color: var(--teal); border: 1px solid var(--teal); border-radius: 3px; padding: 1px 4px; transform: rotate(-6deg); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
    .who { display: flex; align-items: center; gap: 10px; }
    .who img { width: 32px; height: 32px; border-radius: 50%; background: #1f2937; }
    .who-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .who-meta { color: var(--muted); font-size: 12px; }
    .link-btn { background: none; border: 0; color: var(--muted); font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; margin-left: auto; padding: 4px; }
    .link-btn:hover, .link-btn:focus-visible { color: var(--text); }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 42px; border-radius: 8px; border: 1px solid transparent; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
    .btn-discord { background: var(--blurple); color: #fff; }
    .btn-primary { background: var(--teal); color: #04110f; }
    .btn:focus-visible, .switch:focus-visible, .link-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .btn[disabled] { opacity: 0.6; cursor: wait; }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.45; margin-top: 8px; }
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .switch-label { font-weight: 700; }
    .switch { position: relative; width: 52px; height: 30px; border-radius: 999px; border: 1px solid var(--border); background: #334155; cursor: pointer; flex: none; }
    .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
    .switch[aria-checked="true"] { background: var(--teal); }
    .switch[aria-checked="true"]::after { transform: translateX(22px); }
    .footer { color: var(--muted); font-size: 11px; text-align: center; line-height: 1.5; }
    .footer a { color: var(--teal); }
    .footer a.tip { color: var(--muted); text-decoration: none; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; font-size: 10px; display: inline-flex; align-items: center; gap: 4px; padding: 2px 0; }
    .footer a.tip:hover, .footer a.tip:focus-visible { color: var(--teal); }
    .footer a.tip svg { opacity: 0.7; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="brand">
    <img src="icons/icon48.png" alt="" />
    <span>TILTCHECK</span>
    <span class="beta" aria-hidden="true">BETA</span>
  </header>

  <!-- 1. Sign-in -->
  <section class="card" id="signed-out" aria-labelledby="signin-title" hidden>
    <p id="signin-title" class="switch-label">Your settings live on your dashboard.</p>
    <p class="hint" style="margin-top:4px; margin-bottom:12px;">Sign in so this browser follows them. Skip it and you get the defaults.</p>
    <button type="button" class="btn btn-discord" id="btn-signin">Sign in with Discord</button>
  </section>

  <section class="card who" id="signed-in" hidden>
    <img id="who-avatar" alt="" />
    <div style="min-width:0">
      <div class="who-name" id="who-name">you</div>
      <div class="who-meta" id="sync-status" role="status" aria-live="polite"></div>
    </div>
    <button type="button" class="link-btn" id="btn-signout">Sign out</button>
  </section>

  <!-- 2. The one on/off switch -->
  <section class="card">
    <div class="switch-row">
      <span class="switch-label" id="switch-label">TiltCheck is on</span>
      <button type="button" class="switch" id="master-switch" role="switch" aria-checked="true" aria-labelledby="switch-label"></button>
    </div>
    <p class="hint" id="switch-hint">Checks run on casino tabs.</p>
  </section>

  <!-- 3. Everything else lives on the dashboard -->
  <a class="btn btn-primary" id="btn-dashboard" href="https://tiltcheck.me/dashboard/" target="_blank" rel="noopener noreferrer">Open Dashboard</a>

  <p class="footer">Need to talk to someone? <a href="tel:18004262537">1-800-GAMBLER</a><br />

    © 2024–2026 TiltCheck Ecosystem</p>

  <script src="popup.js"></script>
</body>
</html>
