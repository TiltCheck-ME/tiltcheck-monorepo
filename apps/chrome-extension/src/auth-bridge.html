<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TiltCheck Discord Connect</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080a0e;
        --card: rgba(13, 17, 24, 0.85);
        --teal: #17c3b2;
        --border: rgba(23, 195, 178, 0.25);
        --text: #f3f4f6;
        --muted: #94a3b8;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .card {
        width: min(480px, calc(100vw - 32px));
        border-radius: 16px;
        border: 1px solid var(--border);
        background: var(--card);
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      }
      .logo-icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        display: block;
        border-radius: 12px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }
      .status {
        margin: 16px 0;
        padding: 10px 14px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        font-size: 12px;
        font-family: monospace;
        color: var(--teal);
      }
      .actions {
        margin-top: 24px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        cursor: pointer;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        transition: opacity 0.2s, transform 0.1s;
      }
      button:active {
        transform: scale(0.98);
      }
      #open-btn {
        background: var(--teal);
        color: #000;
      }
      #open-btn:hover {
        opacity: 0.9;
      }
      #fallback-link {
        display: block;
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
        text-decoration: underline;
      }
      #fallback-link:hover {
        color: var(--teal);
      }
      #close-btn {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
      }
      #close-btn:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .footer {
        margin-top: 24px;
        font-size: 10px;
        color: rgba(148, 163, 184, 0.4);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="icons/icon128.png" alt="TiltCheck" class="logo-icon" />
      <h1>Connect Discord Account</h1>
      <p>
        Link your Discord account to sync responsible gaming settings, audit history, and voluntary cooldown status.
      </p>
      <div class="status" id="status">Ready to connect.</div>
      <div class="actions">
        <button id="open-btn" type="button">Authorize with Discord</button>
        <button id="close-btn" type="button">Cancel</button>
      </div>
      <a id="fallback-link" href="https://tiltcheck.me/login" target="_blank" rel="noopener noreferrer">Use web login instead &rarr;</a>
      <div class="footer">
        Made for Degens. By Degens.
      </div>
    </main>
    <script src="./auth-bridge.js"></script>
  </body>
</html>
