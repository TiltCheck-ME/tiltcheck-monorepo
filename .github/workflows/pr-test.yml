name: Validate Changed Packages (PR)

on:
  pull_request:
    branches:
      - main
      - degen-lounge

jobs:
  changes:
    runs-on: ubuntu-24.04
    name: Detect Changed Subsystems
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
      cooldown: ${{ steps.filter.outputs.cooldown }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            e2e:
              - 'apps/web/src/**'
              - 'apps/web/public/**'
              - 'apps/web/next.config.*'
              - 'apps/api/**'
              - 'apps/chrome-extension/**'
              - 'apps/user-dashboard/**'
              - 'tests/e2e/**'
              - 'playwright.config.ts'
              - 'packages/**'
              - 'modules/**'
              - 'pnpm-lock.yaml'
            cooldown:
              - 'packages/cooldown-sdk/**'
              - 'programs/cooldown/**'
              - 'apps/api/src/routes/cooldown.ts'
              - 'apps/web/src/app/cooldown/**'
              - 'apps/user-dashboard/src/index.ts'
              - 'apps/user-dashboard/public/**'
              - 'apps/user-dashboard/tests/**'
              - 'apps/chrome-extension/**'
              - 'tests/e2e/extension-e2e.spec.ts'
              - 'scripts/smoke-anchor-devnet.ts'
              - '.github/workflows/cooldown-smoke.yml'
              - '.github/workflows/pr-test.yml'

  validate-changed:
    runs-on: ubuntu-24.04
    name: Validate Changed Packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce root cleanliness
        run: bash tools/check-root-cleanliness.sh

      - name: Enforce no passWithNoTests scripts
        run: node scripts/check-no-pass-with-no-tests.mjs

      # Include dependencies of dependents-of-changed so workspace `exports` -> dist/
      # resolves during Vitest (e.g. linkguard -> config, lockvault -> natural-language-parser).
      - name: Build changed packages
        run: pnpm --filter="...[origin/main]..." --filter="!." build

      - name: Run tests on changed packages
        run: pnpm --filter="...[origin/main]" --filter="!." --if-present test

  cooldown-smoke:
    runs-on: ubuntu-24.04
    name: Cooldown Devnet Smoke Test
    needs: changes
    if: needs.changes.outputs.cooldown == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Cooldown SDK & User Dashboard
        run: |
          pnpm --filter @tiltcheck/cooldown-sdk build
          pnpm --filter @tiltcheck/database build
          pnpm --filter @tiltcheck/user-dashboard build

      - name: Run Anchor Devnet Smoke Test
        run: pnpm smoke:cooldown
        env:
          COOLDOWN_RPC_URL: 'https://api.devnet.solana.com'

      - name: Run User Dashboard Cooldown Tests
        run: pnpm test:cooldown:dashboard

  e2e:
    runs-on: ubuntu-24.04
    name: E2E Tests (Playwright)
    needs: [changes, validate-changed]
    if: needs.changes.outputs.e2e == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Database, Extension & Pages
        run: |
          pnpm --filter @tiltcheck/database build
          pnpm --filter @tiltcheck/chrome-extension package
          pnpm build:pages

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run e2e tests
        run: pnpm test:e2e
        env:
          # Validate this PR's Next.js app, not live GitHub Pages.
          BASE_URL: http://127.0.0.1:3001
          PLAYWRIGHT_WEB_LOCAL: '1'
          PLAYWRIGHT_DEGENS_LOCAL: '1'
          SKIP_ENV_VALIDATION: 'true'
          SKIP_DISCORD_LOGIN: 'true'


