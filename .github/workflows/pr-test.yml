name: Validate Changed Packages (PR)

on:
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    name: Detect E2E-Relevant Changes
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            e2e:
              - 'apps/web/src/**'
              - 'apps/web/public/**'
              - 'apps/web/next.config.*'
              - 'apps/api/**'
              - 'apps/chrome-extension/**'
              - 'apps/user-dashboard/**'
              - 'tests/e2e/**'
              - 'playwright.config.ts'
              - 'packages/**'
              - 'modules/**'
              - 'pnpm-lock.yaml'

  validate-changed:
    runs-on: ubuntu-latest
    name: Validate Changed Packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce root cleanliness
        run: bash tools/check-root-cleanliness.sh

      - name: Enforce no passWithNoTests scripts
        run: node scripts/check-no-pass-with-no-tests.mjs

      # Include dependencies of dependents-of-changed so workspace `exports` -> dist/
      # resolves during Vitest (e.g. linkguard -> config, lockvault -> natural-language-parser).
      - name: Build changed packages
        run: pnpm --filter="...[origin/main]..." --filter="!." build

      - name: Run tests on changed packages
        run: pnpm --filter="...[origin/main]" --filter="!." --if-present test

  e2e:
    runs-on: ubuntu-latest
    name: E2E Tests (Playwright)
    needs: [changes, validate-changed]
    if: needs.changes.outputs.e2e == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run e2e tests
        run: pnpm test:e2e
        env:
          BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://tiltcheck.me' }}
          PLAYWRIGHT_DEGENS_LOCAL: '1'
