title = "TiltCheck Gitleaks Overrides"

[extend]
useDefault = true

[[allowlists]]
description = "Allow placeholder values in environment example files"
condition = "AND"
paths = [
  '''(?:^|/)\.env(?:\.[A-Za-z0-9_-]+)?\.example$''',
]
regexTarget = "line"
regexes = [
  '''(?i)(?:[A-Z0-9_]+)\s*=\s*['"]?(?:ROTATE_THIS_IMMEDIATELY(?:_[A-Z0-9_]+)?|REPLACE_ME(?:_WITH_[A-Z0-9_]+)?|your-[a-z0-9-]+(?:-here)?|<[^>]+>)['"]?''',
]

[[allowlists]]
description = "Allow planning task keys in Linear export docs"
condition = "AND"
paths = [
  '''^docs/ops/linear-tasks(?:-[A-Za-z0-9_-]+)?\.json$''',
]
regexTarget = "line"
regexes = [
  '''"key":\s*"[A-Z0-9]+(?:-[A-Z0-9]+)+"''',
]

[[allowlists]]
description = "Allow test HMAC-SHA256 fixtures in provably fair unit tests"
condition = "AND"
paths = [
  '''^apps/web/src/lib/provably-fair\.test\.ts$''',
]
regexTarget = "line"
regexes = [
  '''b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9''',
]

[[allowlists]]
description = "Discord application public key in the casino-ask Worker config (Ed25519 verify key, public by design)"
condition = "AND"
paths = [
  '''^workers/casino-ask/wrangler\.toml$''',
]
regexTarget = "line"
regexes = [
  '''DISCORD_PUBLIC_KEY\s*=\s*"[0-9a-f]{64}"''',
]
